[project]
name = "systemalerts"
version = "1.0.45"
description = "Vigil: Lightweight Linux Host Operations & Observability Suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohappyeyeballs>=2.4.0,<3.0.0",
    "aiohttp>=3.10.5,<4.0.0",
    "aiosignal>=1.3.1,<2.0.0",
    "attrs>=24.2.0,<26.0.0",
    "discord-py>=2.4.0,<3.0.0",
    "frozenlist>=1.4.1,<2.0.0",
    "idna>=3.8,<4.0",
    "multidict>=6.0.5,<7.0.0",
    "python-decouple>=3.8,<4.0",
    "yarl>=1.9.6,<2.0.0",
    "psutil>=6.0.0,<8.0.0",
    "fastapi>=0.112.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "websockets>=12.0,<16.0",
    "pytest>=8.0.0,<10.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "api"]

